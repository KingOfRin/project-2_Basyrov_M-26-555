[project]
name = "primitive-db"
version = "0.5.0"
description = "Консольная примитивная база данных: таблицы, CRUD-операции и JSON-хранилище"
readme = "README.md"
authors = [
    { name = "Ramil Basyrov", email = "sf.vfkmxbr@mail.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.18.0",
    "prompt>=0.4.1",
]

[project.scripts]
database = "primitive_db.main:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
